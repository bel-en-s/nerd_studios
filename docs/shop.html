<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | Nerd Studios</title>
  <meta name="description" content="Tienda Nerd Studios — objetos y prendas artesanales." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Noto+Serif:ital,wght@0,300;0,400;0,700;1,300&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/nerd_studios/assets/favicon-DDc2renf.jpg" />
  <script type="module" crossorigin src="/nerd_studios/assets/shop-CpLNDEns.js"></script>
  <link rel="modulepreload" crossorigin href="/nerd_studios/assets/cart-DntnNjbk.js">
  <link rel="stylesheet" crossorigin href="/nerd_studios/assets/cart-BzH8pkYZ.css">
  <link rel="stylesheet" crossorigin href="/nerd_studios/assets/shop-DzskMfQS.css">
</head>
<body>
  <div class="page-transition"></div>

  <nav>
    <div class="nav-logo">
      <a href="./index.html">
        <h2 class="nav-logo-text">Nerd Studios</h2>
      </a>
    </div>
    <div class="nav-actions">
      <button class="nav-cart-btn" aria-label="Carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count">0</span>
      </button>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
    <div class="nav-links">
      <a href="./index.html">ABOUT</a>
      <a href="./gallery.html">GALLERY</a>
      <a href="./shop.html" class="active">SHOP</a>
      <a href="#" class="nav-cart-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count">0</span>
      </a>
    </div>
  </nav>

  <main class="shop-page">
    <section class="shop-hero">
      <div class="shop-hero-bg" style="background-image: url('/nerd_studios/images/gallery/2-gallery-nerd-6a15d92b5df70.webp')"></div>
      <div class="shop-hero-overlay"></div>
      <div class="shop-hero-content">
        <p class="shop-hero-subtitle">SHOP</p>
      </div>
    </section>
    <div class="shop-filters" id="shop-filters">
      <button class="filter-btn active" data-filter="all">Todo</button>
      <button class="filter-btn" data-filter="tops">Tops</button>
      <button class="filter-btn" data-filter="outerwear">Outerwear</button>
      <button class="filter-btn" data-filter="bottoms">Bottoms</button>
      <button class="filter-btn" data-filter="accessories">Accessories</button>
      <button class="filter-btn" data-filter="archive_rental">Archive Rental</button>
    </div>
    <div class="product-grid" id="product-grid">
      <div class="loader-shop">
        <p>Cargando productos...</p>
      </div>
    </div>
  </main>

</body>
</html>
